# Render Blueprint for Zentrix HR (Laravel + MySQL). In Render: New → Blueprint → pick this repo and the
# "laravel" branch. Both services need a paid instance type because they keep data on a disk.
services:
  # The app: the Docker image in laravel/ (Apache + PHP 8.2), with uploads and letters on a disk.
  - type: web
    name: zentrix-hr
    runtime: docker
    rootDir: laravel
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: laravel
    plan: starter
    region: frankfurt
    healthCheckPath: /up
    disk:
      name: zentrix-storage
      mountPath: /var/www/html/storage
      sizeGB: 1
    envVars:
      - key: APP_NAME
        value: Zentrix HR
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromService:
          name: zentrix-mysql
          type: pserv
          property: host
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        value: zentrix_hr
      - key: DB_USERNAME
        value: zentrix
      - key: DB_PASSWORD
        fromService:
          name: zentrix-mysql
          type: pserv
          envVarKey: MYSQL_PASSWORD
      # Optional: the key the fingerprint clock sends. Set it in the dashboard if you use a clock.
      - key: BIOMETRIC_DEVICE_KEY
        sync: false

  # MySQL 8, reachable only by the app over Render's private network.
  - type: pserv
    name: zentrix-mysql
    runtime: image
    image:
      url: docker.io/library/mysql:8.0
    plan: starter
    region: frankfurt
    disk:
      name: zentrix-mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 5
    envVars:
      - key: MYSQL_DATABASE
        value: zentrix_hr
      - key: MYSQL_USER
        value: zentrix
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
