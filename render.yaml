# Render Blueprint for Zentrix HR (Laravel), free plan. In Render: New → Blueprint → this repo, "laravel" branch.
#
# The free plan has no disk and no database, so:
#   - the database is TiDB Cloud's free Starter instance "zentrix-hr" (MySQL-compatible, Frankfurt). Its host,
#     port, user and database are below; only the password is entered in the Render dashboard (DB_PASSWORD).
#     TiDB requires TLS with a public certificate, which the container uses automatically;
#   - uploaded files are lost on each redeploy, and the app sleeps after ~15 idle minutes (the payroll and
#     reminder schedule only runs while it is awake). Move to a paid plan with a disk before real use.
services:
  - type: web
    name: zentrix-hr
    runtime: docker
    rootDir: laravel
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: laravel
    plan: free
    region: frankfurt
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Zentrix HR
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_SECURE_COOKIE
        value: "true"
      # Trial site: load the sample company so the system can be explored. Set to "false" (and clear the
      # database) before using it for real staff.
      - key: SEED_DEMO
        value: "true"
      # First administrator, created once on start (must change the password at first sign-in).
      # ADMIN_PASSWORD is entered in the Render dashboard only.
      - key: ADMIN_USERNAME
        value: Lam
      - key: ADMIN_FIRST_NAME
        value: Emmanuel
      - key: ADMIN_LAST_NAME
        value: Lamadeku
      - key: ADMIN_PASSWORD
        sync: false
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: gateway01.eu-central-1.prod.aws.tidbcloud.com
      - key: DB_PORT
        value: "4000"
      - key: DB_DATABASE
        value: zentrix_hr
      - key: DB_USERNAME
        value: 3wg7TG7dWjxhpRf.root
      # The TiDB password (TiDB console → Connect → Generate Password). Entered in the dashboard, never in git.
      - key: DB_PASSWORD
        sync: false
      # Only for a provider with its own CA certificate (Aiven etc.); leave empty for TiDB.
      - key: DB_SSL_CA_PEM
        sync: false
      # Optional: the key the fingerprint clock sends with each punch.
      - key: BIOMETRIC_DEVICE_KEY
        sync: false
