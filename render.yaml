# Render Blueprint for Zentrix HR (Laravel), free plan. In Render: New → Blueprint → this repo, "laravel" branch.
#
# The free plan has no disk and no MySQL, so:
#   - the database is an outside MySQL 8 (for example Aiven's free MySQL); paste its URI as DB_URL when asked,
#     and its CA certificate as DB_SSL_CA_PEM;
#   - uploaded files are lost on each redeploy, and the app sleeps after ~15 idle minutes (the payroll and
#     reminder schedule only runs while it is awake). Move to a paid plan with a disk before real use.
services:
  - type: web
    name: zentrix-hr
    runtime: docker
    rootDir: laravel
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: laravel
    plan: free
    region: frankfurt
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Zentrix HR
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: DB_CONNECTION
        value: mysql
      # mysql://user:password@host:port/database from the MySQL provider. Entered in the dashboard, never in git.
      - key: DB_URL
        sync: false
      # The provider's CA certificate (the whole -----BEGIN CERTIFICATE----- block). Leave empty if the
      # provider uses a public certificate authority (TiDB Cloud does).
      - key: DB_SSL_CA_PEM
        sync: false
      # Optional: the key the fingerprint clock sends with each punch.
      - key: BIOMETRIC_DEVICE_KEY
        sync: false
